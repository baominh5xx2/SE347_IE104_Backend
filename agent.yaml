# LangGraph Multi-Agent System Configuration

system:
  name: "Tour Booking AI System"
  version: "2.0.0"
  description: "Dual-agent system with MCP integration"
  
# LLM Configuration (Shared)
llm:
  provider: "openai"
  model: "gpt-4.1-mini"
  temperature: 0.7
  max_tokens: 2048
  streaming: true

# Agents Configuration
agents:
  # Chat Agent - Main agent handles conversation
  - name: "chat_agent"
    type: "langgraph"
    description: "Main conversational agent"
    config:
      entry_point: "app.v1.services.agent_services.dual_agent_system"
      temperature: 0.7
      
      # Prompt Templates
      prompts:
        system: |
          You are a friendly Vietnamese tour booking assistant.
          Your role is to:
          - Have natural, warm conversations with customers
          - Understand their travel needs and preferences
          - Help them find ideal tour packages
          - Provide accurate information about tours, destinations, and travel
          - Ask clarifying questions when needed
          - Be enthusiastic and knowledgeable about Vietnam travel
          
          IMPORTANT: You are NOT a tour recommendation expert. When users ask about tours:
          1. Ask clarifying questions about their needs (destination, budget, duration, people)
          2. After understanding their needs, say: "Tôi sẽ tìm kiếm tour phù hợp cho bạn ngay!"
          3. DO NOT provide specific tour recommendations, packages, or itineraries
          4. DO NOT mention specific prices, hotels, or tour details
          5. Keep responses general and let the recommendation system handle the details
          
          For booking and other requests, use appropriate tools when available.
          
          Always respond in Vietnamese unless user speaks another language.
          Keep responses concise, friendly, and helpful.
        
        intent_classification: |
          Analyze the user's message and classify their intent.
          
          User message: "{user_message}"
          
          Classify as ONE of:
          - greeting: User is greeting or making small talk
          - booking_request: User wants to book a tour
          - weather_inquiry: User asking about weather
          - flight_inquiry: User asking about flights
          - question: General question about travel/tours
          - other: Other intents
          
          Return only the intent keyword.
        
        entity_extraction: |
          Extract relevant travel booking entities from the user's message.
          
          User message: "{user_message}"
          
          Extract these if mentioned:
          - destination: Location they want to visit (e.g., "Đà Lạt", "Nha Trang")
          - budget: Price range or max budget in VND
          - duration: Number of days
          - people: Number of people
          - start_date: Preferred start date
          - package_id: Specific tour package ID
          - preferences: Any special preferences or requirements
          
          Return in JSON format. If not mentioned, use null.
          Example: {{"destination": "Đà Lạt", "budget": 5000000, "people": 2, "duration": 3}}
          
          Return only valid JSON, no other text.
        
        response_generation: |
          Generate a friendly response to the user.
          
          User message: "{user_message}"
          Intent: {intent}
          Entities: {entities}
          Context: {context}
          
           IMPORTANT: When you need to get user's information or history, use search_episodes:
          - query_text: Search query (e.g., "Đà Nẵng", "budget", "destination")
          - user_id: ALWAYS extract from context when available (this gets ALL user data)
          - limit: Use 10 as default for user history
          
          Example: search_episodes(query_text="Đà Nẵng", user_id="user_123", limit=10)
          
          You have access to MCP tools. If you need to use them, mention that you'll help with the specific request.
          For example:
          - "Tôi sẽ tìm kiếm tour phù hợp cho bạn"
          - "Tôi sẽ kiểm tra thông tin chi tiết tour này"
          - "Tôi sẽ kiểm tra thời tiết tại điểm đến"
          - "Tôi sẽ tìm kiếm chuyến bay cho bạn"
          
          Respond naturally in Vietnamese. Be warm and helpful.
      
      nodes:
        - name: "understand_intent"
          description: "Classify user intent"
          enabled: true
        - name: "extract_entities"
          description: "Extract booking entities"
          enabled: true
        - name: "generate_response"
          description: "Generate friendly response"
          enabled: true
      
      edges:
        - from: "understand_intent"
          to: "extract_entities"
        - from: "extract_entities"
          to: "generate_response"
    
    capabilities:
      - intent_classification
      - entity_extraction
      - conversational_ai
      - episode_search
    
    # Function calling guidelines
    functions:
      search_episodes:
        description: "Search using Graphiti - user_id as focal node gets ALL user's related data"
        parameters:
          query_text: "string (PRIMARY) - Search query (e.g., 'Đà Nẵng', 'budget', 'destination')"
          user_id: "string (optional) - User ID for personalization"
          limit: "integer (optional) - Number of results, default 5"
        usage_examples:
          user_search: |
            # Search user's episodes with query
            search_episodes(
              query_text="Đà Nẵng",
              user_id="user_123",
              limit=5
            )
          general_search: |
            # General semantic search
            search_episodes(
              query_text="du lịch miền Trung",
              limit=5
            )
        important_notes:
          - "query_text is PRIMARY parameter - always provide search query"
          - "user_id enables personalization when available"
          - "Graphiti handles hybrid search automatically"
    
  # Recommendation Agent - Called by Chat Agent when needed
  - name: "recommendation_agent"
    type: "langgraph"
    description: "Recommends tour packages based on user requirements"
    config:
      entry_point: "app.v1.services.agent_services.recommendation_agent"
      temperature: 0.3
      
      # Prompt Templates
      prompts:
        system: |
          You are a tour recommendation expert specializing in Vietnam travel.
          Your job is to:
          - Analyze user requirements (destination, budget, duration, people)
          - Search for matching tour packages using semantic search
          - Rank results by relevance and suitability
          - Provide clear reasoning for recommendations
          - Consider user preferences and travel history
          
          Be analytical, precise, and helpful in your recommendations.
          Focus on value for money and authentic experiences.
        
        reasoning_generation: |
          Based on the user's requirements and the tour packages found, generate a clear explanation.
          
          User requirements:
          {requirements}
          
          Found packages:
          {packages}
          
          IMPORTANT: Before generating reasoning, get user's full history to understand preferences:
          Use search_similar_episodes with:
          - user_id: ALWAYS extract from context (focal node for ALL user data)
          - query_text: Use "" to get all data, or specific query to filter
          - limit: 10 (to get comprehensive history)
          
          Example: search_similar_episodes(user_id="user_123", query_text="", limit=10)
          
          Explain in Vietnamese:
          1. Why these packages are suitable for the user
          2. Key highlights and unique features of recommended tours
          3. How they match user's budget and preferences
          4. What makes each tour special or worth considering
          
          Keep it concise (2-3 sentences per tour), actionable, and enthusiastic.
          Use emojis to make it more engaging.
      
      nodes:
        - name: "search_tours"
          description: "Search tours using semantic search"
          enabled: true
        - name: "rank_packages"
          description: "Rank by relevance to user needs"
          enabled: true
        - name: "generate_reasoning"
          description: "Explain why these tours fit"
          enabled: true
      
      edges:
        - from: "search_tours"
          to: "rank_packages"
        - from: "rank_packages"
          to: "generate_reasoning"
    
    capabilities:
      - semantic_search
      - tour_recommendation
      - reasoning_generation
      - episode_search
    
    # Function calling guidelines for recommendation agent
    functions:
      search_episodes:
        description: "Search user episodes using Graphiti hybrid search"
        parameters:
          query_text: "string (REQUIRED) - Search query (e.g., 'Đà Nẵng', 'budget', 'destination')"
          user_id: "string (optional) - User ID for personalization"
          limit: "integer (optional) - Number of results, default 5"
        usage_examples:
          user_search: |
            # Search user's episodes with query
            search_episodes(
              query_text="Đà Nẵng",
              user_id="user_123",
              limit=5
            )
          general_search: |
            # General semantic search
            search_episodes(
              query_text="du lịch miền Trung",
              limit=5
            )
        important_notes:
          - "query_text is PRIMARY parameter - always provide search query"
          - "user_id enables personalization when available"
          - "Graphiti handles hybrid search automatically"

# Workflow Configuration
workflow:
  type: "conditional"
  max_iterations: 10
  timeout: 300
  
  # Entry point - using dual_agent_system as main orchestrator
  entry_point: "dual_agent_system"
  
  # Note: Routing is now handled internally by dual_agent_system.py
  # The dual_agent_system manages the flow between chat_agent and recommendation_agent

# MCP Configuration
mcp:
  enabled: true
  server_url: "https://seminar-se-ie-mcp-4.onrender.com/mcp"
  timeout: 30
  retry: 2
  fallback: "direct_query"
  
  # Available MCP tools
  tools:
    - name: "create_booking"
      endpoint: "/tools/create_booking"
      method: "POST"
      description: "Create a tour booking"
      parameters:
        - package_id: "string (required)"
        - contact_name: "string (required)"
        - contact_phone: "string (required)"
        - num_people: "integer (required)"
        - special_requests: "string (optional)"

# Memory Configuration
memory:
  type: "conversation_buffer"
  max_history: 10
  storage: "supabase"
  table: "chat_history"

# Database Configuration
database:
  type: "supabase"
  tables:
    - tour_packages
    - bookings
    - otp_verifications
    - payments
    - chat_history
  
# Function Calling Guidelines
function_calling:
  # General guidelines for Graphiti search with focal node
  search_rules:
    - "ALWAYS extract user_id from context when available"
    - "user_id acts as FOCAL NODE to get ALL user's related data"
    - "Use empty query '' with focal node to get ALL user data"
    - "Use specific query with focal node to filter user's data"
    - "Call search BEFORE making recommendations for personalization"
  
  # Parameter mapping for search with focal node
  search_parameter_sources:
    user_id: "context.user_id (REQUIRED for personalization)"
    query_text: "'' for all data, or specific filter query"
    limit: "10 (default for user history)"
  
  # Search query patterns
  search_examples:
    user_search: |
      search_episodes(query_text="Đà Nẵng", user_id="user_123", limit=5)
    general_search: |
      search_episodes(query_text="du lịch miền Trung", limit=5)
    budget_search: |
      search_episodes(query_text="budget price", user_id="user_123", limit=10)

# Capabilities
capabilities:
  - conversational_ai
  - tour_search
  - tour_recommendation
  - booking_management
  - context_awareness
  - multi_agent_collaboration
  - episode_search
