# LangGraph Multi-Agent System Configuration

system:
  name: "Tour Booking AI System"
  version: "2.1.0"
  description: "LangGraph dual-agent system with MCP integration and tool calling loop"
  
# LLM Configuration (Shared)
llm:
  provider: "openai"
  model: "gpt-5-mini"
  temperature: 1.0
  max_tokens: 2048
  streaming: true

# Agents Configuration
agents:
  # Chat Agent - Main agent handles conversation with tool calling loop
  - name: "chat_agent"
    type: "langgraph"
    description: "Main conversational agent with LangGraph agent pattern and tool calling loop"
    config:
      entry_point: "app.v1.services.agent_services.dual_agent_system"
      temperature: 1.0
      
      # Prompt Templates
      prompts:
        system: |
          You are a friendly Vietnamese tour booking assistant.
          
          Your role is to:
          - Have natural, warm conversations with customers
          - Help them find and book tour packages
          - Understand their travel needs through conversation
          - Collect necessary booking information (destination, number of people, package preference)
          - Provide tour recommendations when users ask
          
          CONVERSATION STYLE:
          - Be friendly, warm, and helpful
          - Ask questions naturally, one or two at a time
          - DON'T ask 7 questions at once - it's overwhelming
          - DON'T mention technical tool names or system internals
          - DON'T ask users for user_id or technical details
          - Use tools SILENTLY in the background - user doesn't need to know how you search
          
          WHEN USERS ASK ABOUT TOURS:
          - If they mention a destination, automatically search for available tours using your tools
          - If you need more info (number of people, budget, dates), ask naturally 1-2 questions at a time
          - After gathering basic info (destination + number of people), automatically search and show recommendations
          - Don't ask for permission to search - just do it silently
          
          WHEN YOU RECEIVE RECOMMENDATION RESULTS:
          - Recommendation Agent will provide detailed tour information in the conversation
          - YOU MUST display ALL tours provided - DO NOT summarize or skip any tour
          - Keep the EXACT same format and ALL information from Recommendation Agent
          - Display ALL tours with complete details: tour name, destination, duration, price, Package ID, and full description
          - DO NOT shorten, summarize, or remove any tour from the list
          - Make it easy to read and compare ALL options
          - After showing ALL tours, ask if they want to book and what information you need (number of people, dates, etc.)
          
          TOOLS (use silently, don't mention to users):
          - create_booking: Create booking after collecting all required info (phone, package_id, number_of_people)
          - request_recommendation: Call Recommendation Agent to search for tours
          
          CRITICAL - AFTER CREATING BOOKING:
          - When create_booking tool returns success=True, you MUST STOP immediately
          - DO NOT call any other tools after booking is successful
          - Provide booking confirmation to user with booking_id and next steps
          - This is your final response - do not search for more tours or call any other tools
          
          Always respond in Vietnamese unless user speaks another language.
          
          CRITICAL: When showing tour recommendations:
          - Display ALL tours provided by Recommendation Agent (usually 3-5 tours)
          - Keep ALL information intact - name, destination, duration, price, Package ID, description
          - Use clear numbering (1, 2, 3, etc.) to list each tour
          - DO NOT skip or summarize any tour
          - Each tour should have complete information visible to the user
        
        intent_classification: |
          Analyze the user's message and classify their intent.
          
          User message: "{user_message}"
          
          Classify as ONE of:
          - greeting: User is greeting or making small talk
          - booking_request: User wants to book a tour
          - weather_inquiry: User asking about weather
          - flight_inquiry: User asking about flights
          - question: General question about travel/tours
          - other: Other intents
          
          Return only the intent keyword.
        
        entity_extraction: |
          Extract relevant travel booking entities from the user's message.
          
          User message: "{user_message}"
          
          Extract these if mentioned:
          - destination: Location they want to visit (e.g., "Đà Lạt", "Nha Trang")
          - budget: Price range or max budget in VND
          - duration: Number of days
          - people: Number of people
          - start_date: Preferred start date
          - package_id: Specific tour package ID
          - preferences: Any special preferences or requirements
          
          Return in JSON format. If not mentioned, use null.
          Example: {{"destination": "Đà Lạt", "budget": 5000000, "people": 2, "duration": 3}}
          
          Return only valid JSON, no other text.
        
        response_generation: |
          Generate a friendly response to the user.
          
          User message: "{user_message}"
          Intent: {intent}
          Entities: {entities}
          Context: {context}
          
          GUIDELINES:
          - If user mentions a destination or wants to book, FIRST show tour recommendations
          - Automatically search for tours using search_episodes tool when user mentions destinations
          - Use search_episodes silently - don't tell user you're searching
          - After searching, present results naturally: "Tôi tìm thấy một số tour phù hợp cho bạn..."
          - When showing tour recommendations, ALWAYS include the Package ID in format: [Package ID: xxx]
          - IMPORTANT: You CANNOT create a booking until tour recommendations have been shown first
          - When user wants to book, FIRST ensure recommendations are shown, THEN collect booking info (phone, number of people)
          - When booking, USE THE EXACT package_id from the recommendation results shown earlier
          - NEVER make up or guess package_id - it must come from the recommendations
          - NEVER call create_booking tool before showing tour recommendations
          - Ask follow-up questions naturally, one at a time
          - Don't mention tool names or technical details
          
          Respond naturally in Vietnamese. Be warm, helpful, and concise (2-3 sentences max).
      
      # Graph nodes (following LangGraph agent pattern)
      # Note: Graph is built in dual_agent_system.py using LangGraph StateGraph
      # Flow: chat_llm → (tool_calls? → chat_tools → chat_llm) → check_recommendation → (recommendation_agent if needed)
      nodes:
        - name: "chat_llm"
          description: "LLM decides whether to call tools or respond"
          enabled: true
        - name: "chat_tools"
          description: "Execute tool calls"
          enabled: true
        - name: "check_recommendation"
          description: "Check if recommendation agent is needed"
          enabled: true
      
      # Graph edges managed by dual_agent_system.py with conditional routing
      # chat_llm → conditional → chat_tools (if tool_calls) or check_recommendation (if no tool_calls)
      # chat_tools → chat_llm (loop back)
      # check_recommendation → conditional → recommendation_agent (if needed) or END
    
    capabilities:
      - tool_calling
      - conversational_ai
      - episode_search
      - booking_management
      - context_awareness
      - mcp_integration
    
    # Available tools (LangGraph agent pattern)
    tools:
      create_booking:
        description: "Create booking after collecting: user phone, package_id from recommendations, and number of people. CRITICAL REQUIREMENTS: 1) You MUST wait for tour recommendations to be shown first - NEVER call this tool before recommendations are displayed. 2) package_id MUST be the exact UUID from the recommendation results (format: [Package ID: xxx]). 3) NEVER make up or guess package_id - it must match exactly what was shown in recommendations. 4) If no recommendations have been shown yet, wait for them first."
        parameters:
          user_phone: "string (required) - User phone number"
          package_id: "string (required) - EXACT Tour package ID UUID from recommendation results (format: xxx-xxx-xxx-xxx). Must be the package_id shown in [Package ID: xxx] from recommendations. Example: '6f32f471-3fdb-4928-9264-62cf83c4fa46'"
          number_of_people: "integer (required) - Number of people"
          special_requests: "string (optional) - Special requests"
        usage: "ONLY call this tool AFTER: 1) Tour recommendations have been shown to the user with [Package ID: xxx] format, 2) You have collected ALL required info (phone, package_id from recommendations, number_of_people). NEVER call this tool before recommendations are shown. If recommendations are not yet available, first use search_episodes or wait for recommendation_agent to provide options."
      
      search_episodes:
        description: "Search for tour packages and information. Use silently when user mentions destinations or asks about tours."
        parameters:
          query_text: "string (REQUIRED) - Search query (e.g., 'Đà Lạt', 'tour Nha Trang')"
          user_id: "string (optional) - Extract from context automatically, don't ask user"
          limit: "integer (optional) - Number of results, default 5"
        usage_examples:
          user_search: |
            # Search user's episodes with query
            search_episodes(
              query_text="Đà Nẵng",
              user_id="user_123",
              limit=5
            )
          general_search: |
            # General semantic search
            search_episodes(
              query_text="du lịch miền Trung",
              limit=5
            )
        important_notes:
          - "query_text is PRIMARY parameter - always provide search query"
          - "user_id enables personalization when available"
          - "Graphiti handles hybrid search automatically"
    
  # Recommendation Agent - Called by Chat Agent when needed
  - name: "recommendation_agent"
    type: "langgraph"
    description: "Recommends tour packages based on user requirements"
    config:
      entry_point: "app.v1.services.agent_services.recommendation_agent"
      temperature: 1.0
      
      # Prompt Templates
      prompts:
        system: |
          You are a tour recommendation expert specializing in Vietnam travel.
          Your job is to:
          - Analyze user requirements (destination, budget, duration, people)
          - Search for matching tour packages using semantic search
          - Rank results by relevance and suitability
          - Provide clear reasoning for recommendations
          - Consider user preferences and travel history
          
          Be analytical, precise, and helpful in your recommendations.
          Focus on value for money and authentic experiences.
        
        reasoning_generation: |
          Based on the user's requirements and the tour packages found, generate a clear explanation.
          
          User requirements:
          {requirements}
          
          Found packages:
          {packages}
          
          Explain in Vietnamese:
          1. Why these packages are suitable for the user
          2. Key highlights and unique features of recommended tours
          3. How they match user's budget and preferences
          4. What makes each tour special or worth considering
          
          Keep it concise (2-3 sentences per tour), actionable, and enthusiastic.
          Use emojis to make it more engaging.
      
      nodes:
        - name: "search_tours"
          description: "Search tours using semantic search"
          enabled: true
        - name: "rank_packages"
          description: "Rank by relevance to user needs"
          enabled: true
        - name: "generate_reasoning"
          description: "Explain why these tours fit"
          enabled: true
      
      edges:
        - from: "search_tours"
          to: "rank_packages"
        - from: "rank_packages"
          to: "generate_reasoning"
    
    capabilities:
      - semantic_search
      - tour_recommendation
      - reasoning_generation
      - episode_search
    
    # Function calling guidelines for recommendation agent
    functions:
      search_episodes:
        description: "Search user episodes using Graphiti hybrid search"
        parameters:
          query_text: "string (REQUIRED) - Search query (e.g., 'Đà Nẵng', 'budget', 'destination')"
          user_id: "string (optional) - User ID for personalization"
          limit: "integer (optional) - Number of results, default 5"
        usage_examples:
          user_search: |
            # Search user's episodes with query
            search_episodes(
              query_text="Đà Nẵng",
              user_id="user_123",
              limit=5
            )
          general_search: |
            # General semantic search
            search_episodes(
              query_text="du lịch miền Trung",
              limit=5
            )
        important_notes:
          - "query_text is PRIMARY parameter - always provide search query"
          - "user_id enables personalization when available"
          - "Graphiti handles hybrid search automatically"

# Workflow Configuration
workflow:
  type: "langgraph_agent"
  pattern: "agent_with_tool_calling_loop"
  max_iterations: 10
  timeout: 300
  
  # Entry point - using dual_agent_system as main orchestrator
  entry_point: "dual_agent_system"
  
  # Graph flow (following LangGraph agent pattern):
  # 1. START → chat_llm (LLM decides tool or respond)
  # 2. chat_llm → conditional:
  #    - If tool_calls: chat_tools → chat_llm (loop back for more tool calls or final response)
  #    - If no tool_calls: check_recommendation
  # 3. check_recommendation → conditional:
  #    - If needs recommendation: recommendation_agent → END
  #    - If no recommendation: END
  
  # Key features:
  # - Tool calling loop: LLM can call tools multiple times before responding
  # - Conditional routing: System automatically routes based on context
  # - MessagesState: Proper message handling with LangGraph
  # - MCP integration: Tools connected to MCP server

# MCP Configuration
# NOTE: MCP server URL is now configured via .env file (MCP_SERVER_URL)
# This allows environment-specific configuration (dev, staging, prod)
# 
# To configure MCP server:
# 1. Add to .env file:
#    MCP_SERVER_URL=http://localhost:8001
#    MCP_TIMEOUT=30
#
# 2. agent.yaml values below are used as fallback/defaults only
mcp:
  enabled: true
  server_url: "http://localhost:8001"  # Default, overridden by .env MCP_SERVER_URL
  timeout: 30  # Default, overridden by .env MCP_TIMEOUT
  retry: 2
  fallback: "direct_query"
  
  # Available MCP tools (connected via MCP server)
  tools:
    - name: "create_booking"
      endpoint: "/tools/create_booking"
      method: "POST"
      description: "Create a new tour booking"
      parameters:
        - user_phone: "string (required) - User phone number"
        - package_id: "string (required) - Tour package ID"
        - number_of_people: "integer (required) - Number of people"
        - special_requests: "string (optional) - Special requests"
      usage: "Called when user wants to book a tour - MUST gather all required info first!"

# Memory Configuration
memory:
  type: "conversation_buffer"
  max_history: 10
  storage: "supabase"
  table: "chat_history"

# Database Configuration
database:
  type: "supabase"
  tables:
    - tour_packages
    - bookings
    - otp_verifications
    - payments
    - chat_history
  
# Tool Calling Guidelines (LangGraph Agent Pattern)
tool_calling:
  pattern: "agent_with_tool_calling_loop"
  description: |
    The system uses LangGraph agent pattern where LLM decides when to use tools.
    Tool calling happens in a loop: LLM → Tools → LLM (until no more tool calls needed).
  
  # Tool calling behavior
  behavior:
    - "LLM automatically decides when to use tools based on user request"
    - "Tools are executed automatically when LLM makes tool calls"
    - "LLM receives tool results and can call more tools or respond to user"
    - "Loop continues until LLM provides final response (no more tool calls)"
  
  # Available tools
  available_tools:
    create_booking:
      when_to_use: "When user wants to book a tour"
      required_params: ["user_phone", "package_id", "number_of_people", "travel_date"]
      optional_params: ["special_requests"]
      important: "MUST gather all required information before calling!"
    
    search_episodes:
      when_to_use: "When searching user history or general information"
      required_params: ["query_text"]
      optional_params: ["user_id", "limit"]
      note: "Uses Graphiti hybrid search - user_id enables personalization"
  
  # Search episodes guidelines (Graphiti with focal node)
  search_episodes_rules:
    - "ALWAYS extract user_id from context when available"
    - "user_id acts as FOCAL NODE to get ALL user's related data"
    - "Use specific query_text to filter results"
    - "Use limit to control number of results (default: 5)"
    - "Call search BEFORE making recommendations for personalization"
  
  # Search parameter mapping
  search_parameter_sources:
    user_id: "state.user_id (extracted from conversation context)"
    query_text: "User query or search term (REQUIRED)"
    limit: "5 (default) or 10 (for user history)"
  
  # Search query examples
  search_examples:
    user_history_search: |
      search_episodes(query_text="Đà Nẵng", user_id="user_123", limit=5)
      # Searches user's episodes related to "Đà Nẵng"
    general_search: |
      search_episodes(query_text="du lịch miền Trung", limit=5)
      # General semantic search without user context
    budget_search: |
      search_episodes(query_text="budget price", user_id="user_123", limit=10)
      # Searches user's budget-related episodes

# Capabilities
capabilities:
  - langgraph_agent_pattern
  - tool_calling_loop
  - conversational_ai
  - tour_search
  - tour_recommendation
  - booking_management
  - context_awareness
  - multi_agent_collaboration
  - episode_search
  - mcp_integration
  - conditional_routing
