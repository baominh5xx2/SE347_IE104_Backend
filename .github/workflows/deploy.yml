name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Define project variables
            PROJECT_DIR="$HOME/doan"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            echo "=== Starting deployment ==="
            
            # Check if project directory exists
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Cloning repository..."
              git clone "$REPO_URL" "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              echo "Project directory exists. Updating code..."
              cd "$PROJECT_DIR"
              git pull origin develop
            fi
            
            # Auto-restructure: Move backend files to Backend/ folder if needed
            if [ -f "$PROJECT_DIR/main.py" ] && [ ! -d "$PROJECT_DIR/Backend" ]; then
              echo "=== Restructuring: Moving backend code to Backend/ folder ==="
              mkdir -p "$PROJECT_DIR/Backend"
              # Move backend files (exclude Frontend folder and docker-compose.yml)
              find "$PROJECT_DIR" -maxdepth 1 -type f -not -name "docker-compose.yml" -exec mv {} "$PROJECT_DIR/Backend/" \; 2>/dev/null || true
              find "$PROJECT_DIR" -maxdepth 1 -type d -not -name "." -not -name "Backend" -not -name "SE347_IE104_Frontend" -not -name ".git" -exec mv {} "$PROJECT_DIR/Backend/" \; 2>/dev/null || true
            fi
            
            echo "=== Stopping existing containers ==="
            docker compose down
            
            echo "=== Building and starting containers ==="
            docker compose up -d --build
            
            echo "=== Cleaning up old Docker images ==="
            docker system prune -f
            
            echo "=== Checking container status ==="
            docker compose ps
            
            echo "=== Deployment completed successfully ==="
